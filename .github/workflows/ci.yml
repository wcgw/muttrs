name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lints and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux is where muttrs is used; macOS is where it must keep building.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets
      - name: Tests
        run: cargo test --workspace
      # As ghd checks it: muttrs builds, and its tests pass, with voight left out too.
      - name: Lints without voight
        run: cargo clippy --workspace --all-targets --no-default-features
      - name: Tests without voight
        run: cargo test --workspace --no-default-features
