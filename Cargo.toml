[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Types are named after the domain (`MailboxName` in `mailbox`), which reads better than avoiding the repetition.
module_name_repetitions = "allow"
# Docs name products (WezTerm, OAuth2, iTerm2) more than code: backticks would make them read as identifiers.
doc_markdown = "allow"

[workspace.dependencies]
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ego-tree = "0.11.1"
jiff = { version = "0.2.39", features = ["serde"] }
# SMTP submission, and building the MIME of what's sent. rustls with ring and the platform's roots, as for IMAP.
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "ring", "rustls-native-certs", "smtp-transport", "tokio1", "tokio1-rustls"] }
# Every charset mail is written in, through encoding_rs, not only the single-byte ones.
mail-parser = { version = "1.0.1", features = ["full_encoding"] }
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
open = "5.4.5"
# Drafts are written in Markdown, and sent as it and as the HTML it makes.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ratatui = "0.30.2"
rcgen = "0.14.10"
# Remote Content and OAuth2's token endpoint. TLS by rustls with ring, installed as the process' provider, and the
# platform's verifier (the Keychain on macOS); no aws-lc, which needs a C toolchain and CMake.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "form", "json", "stream"] }
ring = "0.17.14"
rustls-native-certs = "0.8.5"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "std"] }
ratatui-core = "0.1.2"
# HTML parsing (html5ever) and CSS selectors, for the rules of `<style>` elements.
scraper = "0.29.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
wiremock = "0.6.5"

muttrs-gfx = { path = "crates/muttrs-gfx" }
muttrs-mail = { path = "crates/muttrs-mail" }
muttrs-render = { path = "crates/muttrs-render" }

# Decoding and resizing images is unusably slow unoptimized: dependencies are built optimized even in debug builds,
# which keep muttrs' own code easy to debug.
[profile.dev.package."*"]
opt-level = 3
