[package]
name = "muttrs"
description = "A terminal mail client after mutt and vim, that renders HTML mail, images included"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
crossterm.workspace = true
futures-util.workspace = true
jiff.workspace = true
muttrs-gfx.workspace = true
muttrs-mail.workspace = true
muttrs-render.workspace = true
open.workspace = true
ratatui.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true
base64.workspace = true
voight = { workspace = true, optional = true }

[features]
default = ["voight"]
# Assessments of the Pager's text, by voight's model (about 1.7 GB, loaded at startup unless `voight = "off"`).
voight = ["dep:voight"]
# voight on an NVIDIA GPU (`voight = "cuda"`): CUDA in voight and the candle crates it runs its model with. Needs
# the CUDA toolkit (`nvcc`) to build.
cuda = ["voight", "voight/cuda"]
# voight on a Mac's GPU (`voight = "metal"`): Metal in voight and its candle crates. Already on for Apple silicon,
# where voight builds with Metal unless it's built with wgpu.
metal = ["voight", "voight/metal"]
# voight on any other GPU (`voight = "wgpu"`), Intel or AMD say, through Vulkan on Linux. Experimental: candle's wgpu
# backend is unreleased, so voight runs on a fork of candle that has it, without Metal unless `metal` is on too.
wgpu = ["voight", "voight/wgpu"]

[lints]
workspace = true
