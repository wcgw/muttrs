# Catppuccin Mocha (catppuccin.com/palette), as a theme of muttrs': copy it to ~/.config/muttrs/themes/, and set
# theme = "catppuccin-mocha" in config.toml.
#
# A theme restyles the built-in theme it's based on: every style it names replaces that theme's, and what it doesn't
# name stays as it was. A style takes fg and bg (a name, #rrggbb, or an index from "0" to "255") and bold, dim,
# italic, underlined, reversed and crossed_out.

base = "tokyonight-moon"
# The terminal's background: authors' colours are kept where they read on it, and lightened or darkened until they
# do otherwise. "none" draws bodies in the theme's colours only.
page = "#1e1e2e"

[ui]
dim = { fg = "#6c7086" }                           # overlay0: dates, rules, hints
accent = { fg = "#89b4fa" }                        # blue: what has focus
cursor = { bg = "#45475a" }                        # surface1
cursor_unfocused = { bg = "#313244" }              # surface0
unread = { fg = "#cdd6f4", bold = true }           # text
read = { fg = "#a6adc8" }                          # subtext0
flagged = { fg = "#fab387" }                       # peach
label = { fg = "#89dceb", bg = "#313244" }         # sky on surface0: a Label, in the Index
subject = { fg = "#cdd6f4", bold = true }
attachment = { fg = "#94e2d5" }                    # teal
banner = { fg = "#f9e2af" }                        # yellow
found = { fg = "#1e1e2e", bg = "#f9e2af" }
found_current = { fg = "#1e1e2e", bg = "#fab387" }
status = { fg = "#a6adc8", bg = "#313244" }
error = { fg = "#f38ba8" }                         # red
keys = { fg = "#89b4fa", bold = true }
voight = { fg = "#cba6f7" }                        # mauve: voight's Assessment
working = { fg = "#89b4fa" }                       # blue: the Task being done, on the status line
queued = { fg = "#89b4fa", bg = "#45475a" }        # blue on surface1: how many more Tasks are asked
heatmap_human = { fg = "#1e1e2e", bg = "#a6e3a1" } # green: prose voight scored 0%, blended through
heatmap_even = { fg = "#1e1e2e", bg = "#f9e2af" }  # yellow (50%)
heatmap_llm = { fg = "#1e1e2e", bg = "#f38ba8" }   # to red (100%)

[body]
text = { fg = "#cdd6f4" }
link = { fg = "#89dceb", underlined = true }       # sky
link_number = { fg = "#6c7086" }
heading = { fg = "#b4befe", bold = true }          # lavender
code = { fg = "#a6e3a1" }                          # green
mark = { fg = "#1e1e2e", bg = "#f9e2af" }
quotes = [{ fg = "#89b4fa" }, { fg = "#cba6f7" }, { fg = "#94e2d5" }, { fg = "#f5c2e7" }]
attribution = { fg = "#a6adc8", italic = true }
signature = { fg = "#6c7086" }
rule = { fg = "#6c7086" }
table_header = { bold = true }
image = { fg = "#cba6f7", italic = true }          # mauve
